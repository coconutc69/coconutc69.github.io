<!DOCTYPE html>
<html>
<body>
<h1 style="background-color:red">remember to put http:// or https:// in front gng</h1>
<input type="text" id="address">
<button onclick="createLink()">create link</button>
<div id="links"></div>
<br>
<div>
    <h2>quick links</h2><br>
    <h3>search engines</h3><br>
    <a href="https://www.google.com">google</a>
    <a href="https://www.duckduckgo.com">duckduckgo</a><br><br>
    <h3>games</h3><br>
    <a href="https://scratch.mit.edu">scratch</a>
    <a href="https://web.cloudmoonapp.com">cloudmoon cloud gaming</a>
    <a href="https://play.geforcenow.com/mall">geforce now</a><br><br>
    <h3>communication</h3>
    <a href="https://discord.com/app">discord</a>
    <a href="https://web.whatsapp.com">whatapp</a>
</div>

<script>
function createLink() {
    let url = document.getElementById("address").value;
    let a = document.createElement("a");
    a.href = url;
    a.textContent = url;
    a.target = "_blank";
    document.getElementById("links").appendChild(a);
    document.getElementById("links").appendChild(document.createElement("br"));
}
</script>
</body>
</html>
