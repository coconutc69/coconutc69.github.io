<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Classroom</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
        }

        .sidebar ul {
            list-style-type: none;
        }

        .sidebar ul li a {
            display: block;
            padding: 15px 25px;
            color: #ecf0f1;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #34495e;
        }

        .main-content {
            flex-grow: 1;
            background-color: #f8f9fa;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>

    <nav class="sidebar">
        <h2>skibidi restaurant</h2>

        <ul>
            <li><a href="#home">home</a></li>
            <li><a href="#games">games</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <iframe id="pageFrame"></iframe>
    </main>

    <script>
        const iframe = document.getElementById("pageFrame");

        const pages = {
            "#home": "home.html",
            "#games": "games.html"
        };

        function loadPage() {
            const hash = window.location.hash;
            iframe.src = pages[hash] || "home.html";
        }
        loadPage();
        window.addEventListener("hashchange", loadPage);
    </script>

</body>
</html>
