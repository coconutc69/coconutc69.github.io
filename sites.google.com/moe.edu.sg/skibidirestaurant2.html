<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebGL Stress Test</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    font-family: monospace; font-size: 13px; color: #0f0;
    background: rgba(0,0,0,0.6); padding: 8px 10px; border-radius: 6px;
    line-height: 1.5; pointer-events: none; white-space: pre;
  }
  #controls {
    position: fixed; bottom: 8px; left: 8px; z-index: 10;
    font-family: monospace; font-size: 12px; color: #ccc;
    background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px;
  }
  #controls label { display: block; margin: 4px 0; }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="hud">Loading...</div>
<div id="controls">
  <label>Objects: <input id="objCount" type="range" min="100" max="1000000" value="1000000"> <span id="objCountVal"></span></label>
  <label>Lights (fragment cost): <input id="lightCount" type="range" min="1" max="512" value="512"> <span id="lightCountVal"></span></label>
</div>

<script>
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' })
        || canvas.getContext('webgl', { antialias: false, powerPreference: 'high-performance' });

if (!gl) {
  document.getElementById('hud').textContent = 'WebGL not supported on this device/browser.';
  throw new Error('WebGL not supported');
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ---- Shaders ----
// Vertex shader: instanced-style transform per object using per-instance attributes,
// with heavy vertex math (extra trig) to load the vertex stage too.
const vsSource = `
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec3 aOffset;
attribute vec3 aColor;
attribute float aScale;
attribute float aPhase;

uniform mat4 uView;
uniform mat4 uProj;
uniform float uTime;

varying vec3 vNormal;
varying vec3 vColor;
varying vec3 vWorldPos;

void main() {
  float t = uTime + aPhase;
  // heavy-ish vertex math: multiple trig calls per vertex
  float wob = sin(t * 1.7 + aPosition.x * 3.0) * 0.15
            + cos(t * 1.3 + aPosition.y * 4.0) * 0.15
            + sin(t * 0.7 + aPosition.z * 5.0 + aPhase) * 0.1;

  vec3 pos = aPosition * aScale;
  pos += aNormal * wob * aScale;

  float orbit = t * 0.5 + aPhase;
  vec3 worldPos = aOffset + pos;
  worldPos.x += sin(orbit) * 0.5;
  worldPos.y += cos(orbit * 1.3) * 0.5;
  worldPos.z += sin(orbit * 0.7) * 0.5;

  vWorldPos = worldPos;
  vNormal = aNormal;
  vColor = aColor;

  gl_Position = uProj * uView * vec4(worldPos, 1.0);
}
`;

// Fragment shader: dynamic loop over N point lights (uniform-controlled) => expensive per pixel.
// NOTE: 512 lights means 1024 vec3 uniforms (positions + colors), which exceeds the
// GL_MAX_FRAGMENT_UNIFORM_VECTORS budget on most GPUs (commonly 224-1024 total vectors,
// shared with all other uniforms). If compilation/linking fails, this page automatically
// retries with a smaller MAX_LIGHTS value until it succeeds.
function buildFsSource(maxLights) {
  return `
precision highp float;
#define MAX_LIGHTS ${maxLights}
varying vec3 vNormal;
varying vec3 vColor;
varying vec3 vWorldPos;

uniform int uLightCount;
uniform vec3 uLightPos[MAX_LIGHTS];
uniform vec3 uLightColor[MAX_LIGHTS];
uniform vec3 uCameraPos;
uniform float uTime;

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCameraPos - vWorldPos);
  vec3 accum = vec3(0.0);

  for (int i = 0; i < MAX_LIGHTS; i++) {
    if (i >= uLightCount) break;
    vec3 L = uLightPos[i] - vWorldPos;
    float dist = length(L);
    L = normalize(L);
    float atten = 1.0 / (1.0 + dist * dist * 0.15);
    float diff = max(dot(N, L), 0.0);
    vec3 H = normalize(L + V);
    float spec = pow(max(dot(N, H), 0.0), 32.0);
    accum += uLightColor[i] * (diff * atten) + uLightColor[i] * spec * atten * 0.5;
  }

  vec3 color = vColor * (0.15 + accum);
  // extra fake fractal-ish noise cost to burn fragment cycles
  float n = 0.0;
  vec2 p = vWorldPos.xy * 3.0;
  for (int i = 0; i < 6; i++) {
    n += sin(p.x) * cos(p.y) * 0.5;
    p = p * 1.8 + vec2(1.7, 9.2);
  }
  color += n * 0.02;

  gl_FragColor = vec4(color, 1.0);
}
`;
}

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error('Shader compile failed: ' + log);
  }
  return s;
}

function tryBuildProgram(maxLights) {
  const fs = compileShader(gl.FRAGMENT_SHADER, buildFsSource(maxLights));
  const vs = compileShader(gl.VERTEX_SHADER, vsSource);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(prog);
    gl.deleteProgram(prog);
    throw new Error('Program link failed: ' + log);
  }
  return prog;
}

// Try the requested light budget, then back off if the GPU's uniform limits reject it.
const lightCandidates = [512, 256, 128, 64, 32, 16, 8];
let program = null;
let ACTUAL_MAX_LIGHTS = 512;
let fallbackWarning = '';
for (const n of lightCandidates) {
  try {
    program = tryBuildProgram(n);
    ACTUAL_MAX_LIGHTS = n;
    if (n < 512) {
      fallbackWarning = `Requested 512 lights exceeded this GPU's uniform limits; reduced to ${n}.`;
    }
    break;
  } catch (e) {
    console.warn(`MAX_LIGHTS=${n} failed:`, e.message);
  }
}
if (!program) {
  document.getElementById('hud').textContent = 'This GPU/browser cannot compile even a minimal version of this shader.';
  throw new Error('No working shader configuration found');
}
gl.useProgram(program);

// ---- Geometry: an icosphere-ish low-poly sphere (base mesh reused per instance) ----
function createSphere(subdiv) {
  // simple UV sphere
  const positions = [];
  const normals = [];
  const indices = [];
  const rings = subdiv, segments = subdiv * 2;
  for (let y = 0; y <= rings; y++) {
    const v = y / rings;
    const theta = v * Math.PI;
    for (let x = 0; x <= segments; x++) {
      const u = x / segments;
      const phi = u * Math.PI * 2;
      const px = Math.sin(theta) * Math.cos(phi);
      const py = Math.cos(theta);
      const pz = Math.sin(theta) * Math.sin(phi);
      positions.push(px, py, pz);
      normals.push(px, py, pz);
    }
  }
  for (let y = 0; y < rings; y++) {
    for (let x = 0; x < segments; x++) {
      const a = y * (segments + 1) + x;
      const b = a + segments + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }
  return {
    positions: new Float32Array(positions),
    normals: new Float32Array(normals),
    indices: new Uint16Array(indices)
  };
}

const sphere = createSphere(6); // ~ modest poly count per object, multiplied by instance count

const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.bufferData(gl.ARRAY_BUFFER, sphere.positions, gl.STATIC_DRAW);

const normBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
gl.bufferData(gl.ARRAY_BUFFER, sphere.normals, gl.STATIC_DRAW);

const idxBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphere.indices, gl.STATIC_DRAW);

const aPosition = gl.getAttribLocation(program, 'aPosition');
const aNormal = gl.getAttribLocation(program, 'aNormal');

// ---- Per-instance data (we do it the compatible way: re-issue draw calls per object,
// since plain WebGL1 instancing requires an extension; we detect and use it if available) ----

const ext = gl.getExtension('ANGLE_instanced_arrays');
const isWebGL2 = !!gl.drawArraysInstanced;

let MAX_OBJECTS = 1000000;
let objCount = 1000000;
let lightCount = 512;

// Instance attribute buffers
const offsetData = new Float32Array(MAX_OBJECTS * 3);
const colorData = new Float32Array(MAX_OBJECTS * 3);
const scaleData = new Float32Array(MAX_OBJECTS);
const phaseData = new Float32Array(MAX_OBJECTS);

function randRange(a, b) { return a + Math.random() * (b - a); }

for (let i = 0; i < MAX_OBJECTS; i++) {
  const r = randRange(2, 40);
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI;
  offsetData[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
  offsetData[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
  offsetData[i*3+2] = r * Math.cos(phi);

  colorData[i*3+0] = randRange(0.2, 1.0);
  colorData[i*3+1] = randRange(0.2, 1.0);
  colorData[i*3+2] = randRange(0.2, 1.0);

  scaleData[i] = randRange(0.05, 0.25);
  phaseData[i] = Math.random() * Math.PI * 2;
}

const offsetBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
gl.bufferData(gl.ARRAY_BUFFER, offsetData, gl.STATIC_DRAW);

const colorBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);

const scaleBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuf);
gl.bufferData(gl.ARRAY_BUFFER, scaleData, gl.STATIC_DRAW);

const phaseBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuf);
gl.bufferData(gl.ARRAY_BUFFER, phaseData, gl.STATIC_DRAW);

const aOffset = gl.getAttribLocation(program, 'aOffset');
const aColor = gl.getAttribLocation(program, 'aColor');
const aScale = gl.getAttribLocation(program, 'aScale');
const aPhase = gl.getAttribLocation(program, 'aPhase');

function setupAttribs() {
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(aPosition);
  gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
  gl.enableVertexAttribArray(aNormal);
  gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
  gl.enableVertexAttribArray(aOffset);
  gl.vertexAttribPointer(aOffset, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
  gl.enableVertexAttribArray(aColor);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuf);
  gl.enableVertexAttribArray(aScale);
  gl.vertexAttribPointer(aScale, 1, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuf);
  gl.enableVertexAttribArray(aPhase);
  gl.vertexAttribPointer(aPhase, 1, gl.FLOAT, false, 0, 0);

  if (isWebGL2) {
    gl.vertexAttribDivisor(aOffset, 1);
    gl.vertexAttribDivisor(aColor, 1);
    gl.vertexAttribDivisor(aScale, 1);
    gl.vertexAttribDivisor(aPhase, 1);
  } else if (ext) {
    ext.vertexAttribDivisorANGLE(aOffset, 1);
    ext.vertexAttribDivisorANGLE(aColor, 1);
    ext.vertexAttribDivisorANGLE(aScale, 1);
    ext.vertexAttribDivisorANGLE(aPhase, 1);
  }
}
setupAttribs();

const uView = gl.getUniformLocation(program, 'uView');
const uProj = gl.getUniformLocation(program, 'uProj');
const uTime = gl.getUniformLocation(program, 'uTime');
const uLightCount = gl.getUniformLocation(program, 'uLightCount');
const uLightPos = gl.getUniformLocation(program, 'uLightPos[0]');
const uLightColor = gl.getUniformLocation(program, 'uLightColor[0]');
const uCameraPos = gl.getUniformLocation(program, 'uCameraPos');

gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.clearColor(0.02, 0.02, 0.05, 1.0);

// ---- Matrix helpers (minimal, no external lib) ----
function perspective(fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  const nf = 1 / (near - far);
  return new Float32Array([
    f/aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far+near)*nf, -1,
    0, 0, 2*far*near*nf, 0
  ]);
}

function lookAt(eye, center, up) {
  let z0 = eye[0]-center[0], z1 = eye[1]-center[1], z2 = eye[2]-center[2];
  let len = Math.hypot(z0,z1,z2); z0/=len; z1/=len; z2/=len;
  let x0 = up[1]*z2 - up[2]*z1, x1 = up[2]*z0 - up[0]*z2, x2 = up[0]*z1 - up[1]*z0;
  len = Math.hypot(x0,x1,x2); if (len) { x0/=len; x1/=len; x2/=len; }
  let y0 = z1*x2 - z2*x1, y1 = z2*x0 - z0*x2, y2 = z0*x1 - z1*x0;
  return new Float32Array([
    x0,y0,z0,0,
    x1,y1,z1,0,
    x2,y2,z2,0,
    -(x0*eye[0]+x1*eye[1]+x2*eye[2]),
    -(y0*eye[0]+y1*eye[1]+y2*eye[2]),
    -(z0*eye[0]+z1*eye[1]+z2*eye[2]),
    1
  ]);
}

// ---- Lights (CPU-side, animated, uploaded each frame) ----
const lightPosArr = new Float32Array(ACTUAL_MAX_LIGHTS * 3);
const lightColorArr = new Float32Array(ACTUAL_MAX_LIGHTS * 3);
for (let i = 0; i < ACTUAL_MAX_LIGHTS; i++) {
  lightColorArr[i*3+0] = randRange(0.3, 1.0);
  lightColorArr[i*3+1] = randRange(0.3, 1.0);
  lightColorArr[i*3+2] = randRange(0.3, 1.0);
}

// ---- UI ----
const objSlider = document.getElementById('objCount');
const objVal = document.getElementById('objCountVal');
const lightSlider = document.getElementById('lightCount');
const lightVal = document.getElementById('lightCountVal');

function syncUI() {
  objVal.textContent = objCount;
  lightVal.textContent = lightCount;
}
objSlider.addEventListener('input', () => { objCount = parseInt(objSlider.value, 10); syncUI(); });
lightSlider.addEventListener('input', () => { lightCount = parseInt(lightSlider.value, 10); syncUI(); });
lightSlider.max = ACTUAL_MAX_LIGHTS;
lightCount = Math.min(lightCount, ACTUAL_MAX_LIGHTS);
objSlider.value = objCount;
lightSlider.value = lightCount;
syncUI();

const hud = document.getElementById('hud');
let lastTime = performance.now();
let frames = 0;
let fpsAccum = 0;
let fps = 0;
let start = performance.now();

function drawFrame(now) {
  const t = (now - start) / 1000;
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  frames++;
  fpsAccum += dt;
  if (fpsAccum >= 0.5) {
    fps = frames / fpsAccum;
    frames = 0;
    fpsAccum = 0;
  }

  resizeCheck();

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const aspect = canvas.width / canvas.height;
  const proj = perspective(Math.PI/3, aspect, 0.1, 200);
  const camX = Math.sin(t * 0.15) * 45;
  const camZ = Math.cos(t * 0.15) * 45;
  const eye = [camX, 15, camZ];
  const view = lookAt(eye, [0,0,0], [0,1,0]);

  gl.uniformMatrix4fv(uProj, false, proj);
  gl.uniformMatrix4fv(uView, false, view);
  gl.uniform1f(uTime, t);
  gl.uniform3fv(uCameraPos, eye);

  // animate lights around the scene
  const lc = Math.min(lightCount, ACTUAL_MAX_LIGHTS);
  for (let i = 0; i < lc; i++) {
    const a = t * (0.3 + i * 0.02) + i * 1.7;
    const r = 10 + (i % 5) * 6;
    lightPosArr[i*3+0] = Math.sin(a) * r;
    lightPosArr[i*3+1] = Math.sin(a * 0.7 + i) * 8;
    lightPosArr[i*3+2] = Math.cos(a) * r;
  }
  gl.uniform1i(uLightCount, lc);
  gl.uniform3fv(uLightPos, lightPosArr.subarray(0, lc*3));
  gl.uniform3fv(uLightColor, lightColorArr.subarray(0, lc*3));

  const count = Math.min(objCount, MAX_OBJECTS);
  const indexCount = sphere.indices.length;

  if (isWebGL2) {
    gl.drawElementsInstanced(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0, count);
  } else if (ext) {
    ext.drawElementsInstancedANGLE(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0, count);
  } else {
    // Fallback: no instancing support, draw a capped number of individual objects
    // by re-binding offset uniforms would be needed; for simplicity just draw once.
    gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
  }

  const triCount = (indexCount / 3) * count;
  hud.textContent =
`WebGL Stress Test
Renderer: ${isWebGL2 ? 'WebGL2 (instanced)' : (ext ? 'WebGL1 + ANGLE instancing' : 'WebGL1 (no instancing - limited)')}
FPS: ${fps.toFixed(1)}
Objects: ${count}
Triangles/frame: ${triCount.toLocaleString()}
Lights: ${lc} (max supported: ${ACTUAL_MAX_LIGHTS})
Resolution: ${canvas.width}x${canvas.height}${fallbackWarning ? '\n' + fallbackWarning : ''}`;

  requestAnimationFrame(drawFrame);
}

let lastW = 0, lastH = 0;
function resizeCheck() {
  if (canvas.width !== lastW || canvas.height !== lastH) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    lastW = canvas.width;
    lastH = canvas.height;
  }
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  hud.textContent = 'webgl crashed';
});

requestAnimationFrame(drawFrame);
</script>
</body>
</html>
