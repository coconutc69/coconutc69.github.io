<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Viewer</title>
</head>
<body>
    <input type="file" id="pdf" accept="application/pdf">

    <script>
        document.getElementById("pdf").addEventListener("change", function () {
            const file = this.files[0];

            if (!file) return;

            location.href = URL.createObjectURL(file);
        });
    </script>
</body>
</html>
