<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIP Site Viewer</title>
<style>
  body.live { margin: 0; overflow: hidden; }
  #site { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<main id="start">
  <input id="file" type="file" accept=".zip,application/zip,application/x-zip-compressed">
  <div id="pick"></div>
  <p id="status"></p>
</main>
<script>
(() => {
'use strict';

const ORIGIN = 'https://zipsite.invalid';
const MIME = {
  html:'text/html', htm:'text/html', css:'text/css', js:'text/javascript', mjs:'text/javascript', cjs:'text/javascript',
  json:'application/json', map:'application/json', txt:'text/plain', xml:'application/xml', svg:'image/svg+xml',
  png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', avif:'image/avif',
  ico:'image/x-icon', bmp:'image/bmp', woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf',
  eot:'application/vnd.ms-fontobject', mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', m4a:'audio/mp4',
  mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime', pdf:'application/pdf', wasm:'application/wasm',
  zip:'application/zip', csv:'text/csv', md:'text/markdown', webmanifest:'application/manifest+json'
};

let FILES = new Map(), LOWER = new Map();
let frame = null, current = null;

const $ = id => document.getElementById(id);
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const ext = p => { const m = /\.([^./]+)$/.exec(p); return m ? m[1].toLowerCase() : ''; };
const kind = p => { const e = ext(p); return (e === 'html' || e === 'htm') ? 'html' : e === 'css' ? 'css' : (e === 'js' || e === 'mjs' || e === 'cjs') ? 'js' : 'other'; };
const virt = p => ORIGIN + '/' + enc(p);
const skip = v => !v || /^\s*(data:|blob:|javascript:|mailto:|tel:|about:|#)/i.test(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolveRef(ref, baseUrl) {
  try {
    const u = new URL(ref.trim(), baseUrl);
    if (u.origin !== ORIGIN) return null;
    return decodeURIComponent(u.pathname.slice(1));
  } catch (e) { return null; }
}
function exact(p) { return FILES.get(p) || LOWER.get(p.toLowerCase()) || null; }
function lookup(p) {
  const c = [p];
  if (p === '' || p.endsWith('/')) c.push(p + 'index.html', p + 'index.htm');
  else c.push(p + '.html', p + '.htm', p + '/index.html', p + '/index.htm');
  for (const x of c) { const f = exact(x); if (f) return f; }
  return null;
}

/* ---------- Minimal lazy ZIP reader: only the file list is read up front; each file is re-read from the ZIP on demand ---------- */
function warn(msg) {
  console.error(msg);
  let t = document.getElementById('zwarn');
  if (!t) {
    t = document.createElement('div'); t.id = 'zwarn';
    t.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;max-width:90%;padding:8px 12px;background:#b00020;color:#fff;font:14px system-ui,sans-serif;border-radius:6px';
    document.body.appendChild(t);
  }
  t.textContent = msg; clearTimeout(t._h); t._h = setTimeout(() => t.remove(), 8000);
}

async function readZip(file) {
  const rd = async (start, len) => {
    try { return await file.slice(start, start + len).arrayBuffer(); }
    catch (e) {
      const m = 'Could not read the ZIP - drive disconnected or file changed?';
      warn(m); throw new Error(m);
    }
  };
  const size = file.size;
  const tailLen = Math.min(size, 65557);
  const tail = new DataView(await rd(size - tailLen, tailLen));
  let e = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("Can't find the ZIP directory - is this a ZIP file?");
  let count = tail.getUint16(e + 10, true), cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  if (count === 0xFFFF || cdSize === 0xFFFFFFFF || cdOff === 0xFFFFFFFF) {
    const l = new DataView(await rd(size - tailLen + e - 20, 20));
    if (l.getUint32(0, true) !== 0x07064b50) throw new Error('Corrupted ZIP64 data');
    const z = new DataView(await rd(Number(l.getBigUint64(8, true)), 56));
    if (z.getUint32(0, true) !== 0x06064b50) throw new Error('Corrupted ZIP64 data');
    count = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOff = Number(z.getBigUint64(48, true));
  }
  const cd = await rd(cdOff, cdSize);
  const v = new DataView(cd), u8 = new Uint8Array(cd), td = new TextDecoder();
  const out = []; let p = 0;
  for (let i = 0; i < count && p + 46 <= cd.byteLength; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('Corrupted ZIP directory');
    const flags = v.getUint16(p + 8, true), method = v.getUint16(p + 10, true);
    let comp = v.getUint32(p + 20, true), uncomp = v.getUint32(p + 24, true), off = v.getUint32(p + 42, true);
    const nl = v.getUint16(p + 28, true), el = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    let x = p + 46 + nl; const xe = x + el;
    while (x + 4 <= xe) {
      const id = v.getUint16(x, true), sz = v.getUint16(x + 2, true);
      if (id === 1) {
        let q = x + 4;
        if (uncomp === 0xFFFFFFFF) { uncomp = Number(v.getBigUint64(q, true)); q += 8; }
        if (comp === 0xFFFFFFFF) { comp = Number(v.getBigUint64(q, true)); q += 8; }
        if (off === 0xFFFFFFFF) { off = Number(v.getBigUint64(q, true)); q += 8; }
      }
      x += 4 + sz;
    }
    p += 46 + nl + el + cl;
    if (!name.endsWith('/')) out.push([name, { async: t => extract(rd, { flags, method, comp, off, name }, t) }]);
  }
  return out;
}

// Re-reads just this one file from the ZIP (local header + compressed bytes) and inflates it.
async function extract(rd, m, type) {
  if (m.flags & 1) throw new Error('Encrypted ZIPs are not supported');
  const h = new DataView(await rd(m.off, 30));
  if (h.getUint32(0, true) !== 0x04034b50) throw new Error('Corrupted ZIP entry: ' + m.name);
  const start = m.off + 30 + h.getUint16(26, true) + h.getUint16(28, true);
  let buf;
  if (m.method === 0) buf = await rd(start, m.comp);
  else if (m.method === 8) {
    const b = new Blob([await rd(start, m.comp)]);
    buf = await new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  } else throw new Error('Unsupported compression method ' + m.method + ' for ' + m.name);
  return type === 'string' ? new TextDecoder().decode(buf) : buf;
}

/* ---------- Lazy file access: a file is only read + turned into a blob URL when first needed ---------- */
function index(entries) {
  FILES = new Map(); LOWER = new Map();
  for (const [p, e] of entries) {
    const f = { path: p, entry: e, m: {}, url: null, deps: null, building: false };
    FILES.set(p, f); LOWER.set(p.toLowerCase(), f);
  }
}
const memo = (f, k, fn) => f.m[k] || (f.m[k] = fn().catch(err => { delete f.m[k]; throw err; }));
const blob = (d, t) => URL.createObjectURL(new Blob([d], { type: t }));

// Returns a Promise<blobUrl>. raw=true gives an HTML file's untouched source (for fetch/XHR).
function urlOf(f, raw) {
  const k = kind(f.path);
  if (k === 'html') {
    return raw
      ? memo(f, 'raw', async () => blob(await f.entry.async('arraybuffer'), 'text/html'))
      : memo(f, 'page', async () => blob((await buildHtml(f)).html, 'text/html'));
  }
  if (k === 'css') return memo(f, 'css', async () => {
    f.building = true;
    try { return f.url = blob(await rewriteCss(await f.entry.async('string'), virt(f.path)), 'text/css'); }
    finally { f.building = false; }
  });
  if (k === 'js') return memo(f, 'js', async () => {
    const t = await f.entry.async('string');
    const deps = [];
    const out = rewriteJs(t, virt(f.path), deps);
    f.deps = deps;
    return f.url = blob(out, 'text/javascript');
  });
  return memo(f, 'bin', async () => f.url = blob(await f.entry.async('arraybuffer'), MIME[ext(f.path)] || 'application/octet-stream'));
}

async function getUrl(path, raw) {
  const f = exact(path) || lookup(path);
  return f ? urlOf(f, raw) : null;
}

/* ---------- JS / CSS rewriting ---------- */
const JS_RE = /(\bfrom\s*|\bimport\s*\(?\s*)(["'])([^"'\n]+)\2/g;
function rewriteJs(code, baseUrl, deps) {
  return code.replace(JS_RE, (m, pre, q, spec) => {
    if (!/^(\.{1,2}\/|\/)/.test(spec)) return m;
    const p = resolveRef(spec, baseUrl);
    const f = p !== null && exact(p);
    if (!f) return m;
    if (deps) deps.push(f);
    return pre + q + virt(f.path) + q;
  });
}

// Read a JS file and everything it imports (cycle-safe) so the page's import map can cover it.
async function jsDeps(f, seen) {
  if (seen.has(f)) return;
  seen.add(f);
  await urlOf(f);
  await Promise.all((f.deps || []).map(d => jsDeps(d, seen)));
}

async function rewriteCss(css, baseUrl) {
  const re = /url\(\s*(['"]?)([^'")]*?)\1\s*\)|@import\s+(['"])([^'"]+)\3/g;
  const ms = [...css.matchAll(re)];
  if (!ms.length) return css;
  const outs = await Promise.all(ms.map(async m => {
    const isImp = m[4] !== undefined;
    const ref = isImp ? m[4] : m[2];
    if (ref && !skip(ref)) {
      const p = resolveRef(ref, baseUrl);
      const f = p !== null && exact(p);
      if (f && !f.building) {
        const u = await urlOf(f);
        if (u) return (isImp ? '@import url("' : 'url("') + u + '")';
      }
    }
    return m[0];
  }));
  let i = 0;
  return css.replace(re, () => outs[i++]);
}

/* ---------- Shim injected into every page (runs inside the page) ---------- */
function shim(CFG) {
  const ORIGIN = 'https://zipsite.invalid', MAP = CFG.map;
  const local = u => { try { const x = new URL(String(u), CFG.base); return x.origin === ORIGIN ? x : null; } catch (e) { return null; } };
  const pathOf = x => { try { return decodeURIComponent(x.pathname.slice(1)); } catch (e) { return x.pathname.slice(1); } };
  const nav = x => { top.postMessage({ zipNav: 1, path: pathOf(x), hash: x.hash }, '*'); };
  const isPage = x => { const m = /\.([^./]+)$/.exec(x.pathname); return !m || /^html?$/i.test(m[1]); };

  // ask the viewer to read a file out of the ZIP on demand
  const pend = {}; let n = 0;
  window.addEventListener('message', e => {
    const d = e.data;
    if (d && d.zipRes && pend[d.id]) { pend[d.id](d.url); delete pend[d.id]; }
  });
  const ask = (x, raw) => new Promise(res => {
    const id = ++n; pend[id] = res;
    top.postMessage({ zipGet: 1, id, path: pathOf(x), raw: !!raw }, '*');
  });

  // open a non-page file in a new tab (blank tab opened synchronously so popup blockers allow it)
  const wo = window.open;
  const openZip = (x, a) => {
    if (isPage(x)) { nav(x); return null; }
    if (a && a.hasAttribute('download')) {
      ask(x).then(u => {
        if (!u) return;
        const t = document.createElement('a');
        t.href = u; t.download = a.getAttribute('download') || pathOf(x).split('/').pop();
        document.body.appendChild(t); t.click(); t.remove();
      });
      return null;
    }
    const w = wo.call(window, 'about:blank', '_blank');
    ask(x).then(u => { if (w) { if (u) w.location.href = u; else w.close(); } });
    return w;
  };

  // fetch / XHR
  const of = window.fetch;
  window.fetch = function (input, init) {
    if (typeof input === 'string' || input instanceof URL) {
      const x = local(input);
      if (x) return ask(x, true).then(u => u ? of.call(window, u, init) : new Response('Not found in ZIP', { status: 404, statusText: 'Not Found' }));
    }
    return of.call(this, input, init);
  };
  const oo = XMLHttpRequest.prototype.open, os = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u, ...r) {
    const x = u && local(u);
    if (x) { this._z = { m, x, r }; return oo.call(this, m, 'data:,', ...r); }
    this._z = null;
    return oo.call(this, m, u, ...r);
  };
  XMLHttpRequest.prototype.send = function (body) {
    const z = this._z;
    if (!z) return os.call(this, body);
    ask(z.x, true).then(u => {
      oo.call(this, z.m, u || 'data:,', ...z.r);
      os.call(this, body);
    });
  };

  // dynamically-set resource URLs (resolved asynchronously)
  [[HTMLImageElement,'src'],[HTMLScriptElement,'src'],[HTMLLinkElement,'href'],[HTMLMediaElement,'src'],
   [HTMLSourceElement,'src'],[HTMLIFrameElement,'src'],[HTMLEmbedElement,'src'],[HTMLVideoElement,'poster'],
   [HTMLObjectElement,'data'],[HTMLTrackElement,'src']].forEach(([C, k]) => {
    const d = Object.getOwnPropertyDescriptor(C.prototype, k);
    if (!d || !d.set) return;
    Object.defineProperty(C.prototype, k, { configurable: true, enumerable: d.enumerable, get: d.get, set(v) {
      const x = v && local(v);
      if (!x) return d.set.call(this, v);
      ask(x).then(u => d.set.call(this, u || v));
    } });
  });
  const sa = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (n2, v) {
    if (/^(src|href|poster|data)$/i.test(n2) && this.tagName !== 'A' && this.tagName !== 'AREA') {
      const x = v && local(v);
      if (x) { ask(x).then(u => sa.call(this, n2, u || v)); return; }
    }
    return sa.call(this, n2, v);
  };

  // Workers need a URL synchronously: works if the file was already loaded by the page
  const W = window.Worker;
  if (W) {
    window.Worker = function (u, o) { const x = local(u); return new W((x && MAP[pathOf(x)]) || u, o); };
    window.Worker.prototype = W.prototype;
  }

  // history API (SPA routers) - fail quietly instead of throwing
  ['pushState', 'replaceState'].forEach(k => {
    const o = history[k];
    history[k] = function (s, t, u) { try { return o.call(this, s, t, u); } catch (e) { try { return o.call(this, s, t); } catch (e2) {} } };
  });

  // window.open
  window.open = function (u, ...r) {
    const x = u && local(u);
    if (x) return openZip(x);
    return wo.call(this, u, ...r);
  };

  // link clicks
  document.addEventListener('click', e => {
    if (e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    const a = e.target && e.target.closest ? e.target.closest('a[href],area[href]') : null;
    if (!a) return;
    const raw = (a.getAttribute('href') || '').trim();
    if (raw[0] === '#') {
      e.preventDefault();
      let id = raw.slice(1); try { id = decodeURIComponent(id); } catch (err) {}
      if (!id) { window.scrollTo(0, 0); return; }
      const el = document.getElementById(id) || document.getElementsByName(id)[0];
      if (el) el.scrollIntoView();
      return;
    }
    if (/^(javascript|mailto|tel|data|blob|sms):/i.test(raw)) return;
    const x = local(raw);
    if (!x) { if (!a.target) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } return; }
    e.preventDefault();
    openZip(x, a);
  }, true);

  // script-driven navigation (location.href = '...', forms) where supported
  if (window.navigation && navigation.addEventListener) {
    navigation.addEventListener('navigate', e => {
      if (!e.cancelable || e.hashChange || e.navigationType === 'traverse' || e.navigationType === 'reload') return;
      const x = local(e.destination.url);
      if (!x) return;
      e.preventDefault();
      openZip(x);
    });
  }
}

/* ---------- Build a page (only reads the files this page actually references) ---------- */
async function buildHtml(f) {
  f.building = true;
  try {
    const src = await f.entry.async('string');
    const doc = new DOMParser().parseFromString(src, 'text/html');
    doc.querySelectorAll('meta[http-equiv]').forEach(m => { if (/content-security-policy/i.test(m.getAttribute('http-equiv'))) m.remove(); });

    let baseUrl = virt(f.path);
    const be = doc.querySelector('base[href]');
    if (be) { try { baseUrl = new URL(be.getAttribute('href'), baseUrl).href; } catch (e) {} be.remove(); }

    const seen = new Set();
    const fix = async (el, attr, nav) => {
      const v = el.getAttribute(attr);
      if (!v || skip(v)) return;
      const p = resolveRef(v, baseUrl);
      if (p === null) return;
      const t = nav ? lookup(p) : exact(p);
      if (!t || t.building) return;
      const u = await urlOf(t);
      if (u) { el.setAttribute(attr, u); el.removeAttribute('integrity'); el.removeAttribute('crossorigin'); }
      if (el.localName === 'script' && kind(t.path) === 'js') await jsDeps(t, seen);
    };

    const tasks = [];
    for (const el of doc.querySelectorAll('*')) {
      const tag = el.localName;
      tasks.push((async () => {
        if (['img','script','source','video','audio','track','embed','input'].includes(tag)) await fix(el, 'src');
        if (tag === 'iframe') await fix(el, 'src', true);
        if (tag === 'video') await fix(el, 'poster');
        if (tag === 'object') await fix(el, 'data');
        if (tag === 'link' || tag === 'image') await fix(el, 'href');
        if (tag === 'image') await fix(el, 'xlink:href');

        if ((tag === 'img' || tag === 'source') && el.hasAttribute('srcset')) {
          const parts = el.getAttribute('srcset').split(',').map(s => s.trim()).filter(Boolean);
          const out = await Promise.all(parts.map(async part => {
            const [u, ...d] = part.split(/\s+/);
            let rep = u;
            if (!skip(u)) {
              const p = resolveRef(u, baseUrl);
              const f2 = p !== null && exact(p);
              if (f2) rep = await urlOf(f2) || u;
            }
            return [rep, ...d].join(' ');
          }));
          el.setAttribute('srcset', out.join(', '));
        }
        if (el.hasAttribute('style')) {
          const s = el.getAttribute('style');
          if (/url\(/i.test(s)) el.setAttribute('style', await rewriteCss(s, baseUrl));
        }
        if (tag === 'style') el.textContent = await rewriteCss(el.textContent, baseUrl);
        if (tag === 'script' && !el.hasAttribute('src')) {
          const ty = (el.getAttribute('type') || '').toLowerCase();
          if (!ty || ty === 'module' || ty.includes('javascript')) {
            const deps = [];
            el.textContent = rewriteJs(el.textContent, baseUrl, deps);
            await Promise.all(deps.map(d => jsDeps(d, seen)));
          }
        }
      })());
    }
    await Promise.all(tasks);

    let icon = null;
    const ic = doc.querySelector('link[rel~="icon"]');
    if (ic && /^blob:/.test(ic.getAttribute('href') || '')) icon = ic.getAttribute('href');

    // import map + known-file map only contain files that have actually been read so far
    const imports = {}, map = {};
    for (const g of FILES.values()) {
      if (!g.url) continue;
      map[g.path] = g.url;
      if (g.deps) imports[virt(g.path)] = g.url;
    }

    const baseEl = doc.createElement('base'); baseEl.setAttribute('href', baseUrl);
    const im = doc.createElement('script'); im.setAttribute('type', 'importmap');
    im.textContent = JSON.stringify({ imports }).replace(/</g, '\\u003c');
    const sh = doc.createElement('script');
    sh.textContent = '(' + shim.toString() + ')(' + JSON.stringify({ base: baseUrl, map }).replace(/</g, '\\u003c') + ');';
    doc.head.prepend(baseEl, im, sh);

    const dt = doc.doctype ? new XMLSerializer().serializeToString(doc.doctype) : '';
    return { html: dt + doc.documentElement.outerHTML, title: doc.title, icon };
  } finally { f.building = false; }
}

/* ---------- Showing pages ---------- */
function scrollHash(h) {
  try {
    let id = h.slice(1); try { id = decodeURIComponent(id); } catch (e) {}
    const d = frame.contentDocument;
    const el = d.getElementById(id) || d.getElementsByName(id)[0];
    if (el) el.scrollIntoView();
  } catch (e) {}
}

async function show(path, hash, push) {
  const f = lookup(path);
  if (!f) {
    frame.srcdoc = '<body style="font-family:system-ui,sans-serif;padding:2rem"><h1>404</h1><p><code>' + esc(path) + '</code> was not found in the ZIP.</p></body>';
    return;
  }
  if (kind(f.path) !== 'html') { const u = await urlOf(f); if (u) window.open(u, '_blank'); return; }
  if (f.path === current && hash) { scrollHash(hash); return; }
  const r = await buildHtml(f);
  current = f.path;
  frame.srcdoc = r.html;
  document.title = r.title || f.path;
  if (r.icon) {
    let l = document.querySelector('link[rel="icon"]');
    if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
    l.href = r.icon;
  }
  if (push) history.pushState({ path: f.path }, '', '#' + enc(f.path));
  if (hash) frame.addEventListener('load', () => scrollHash(hash), { once: true });
}

function mount() {
  $('start').remove();
  document.body.className = 'live';
  frame = document.createElement('iframe');
  frame.id = 'site';
  frame.setAttribute('allow', 'autoplay; fullscreen; camera; microphone; clipboard-read; clipboard-write; gamepad; geolocation; accelerometer; gyroscope');
  frame.setAttribute('allowfullscreen', '');
  document.body.appendChild(frame);
  window.addEventListener('message', async e => {
    const d = e.data;
    if (!d || e.origin !== location.origin) return;
    if (d.zipNav) show(d.path, d.hash, true).catch(err => warn(err.message || String(err)));
    else if (d.zipGet && e.source) {
      let url = null;
      try { url = await getUrl(d.path, d.raw); } catch (err) { warn(err.message || String(err)); }
      e.source.postMessage({ zipRes: 1, id: d.id, url }, '*');
    }
  });
  window.addEventListener('popstate', e => {
    if (e.state && e.state.path) { current = null; show(e.state.path, '', false); }
    else location.reload();
  });
}

/* ---------- Start screen ---------- */
function setStatus(msg, err) { const s = $('status'); if (!s) { if (err) warn(msg); return; } s.textContent = msg; s.className = err ? 'err' : ''; }

async function launch(file) {
  try {
    setStatus('Reading ZIP directory…');
    let entries = (await readZip(file)).map(([p, e]) => [p.replace(/\\/g, '/'), e])
      .filter(([p]) => !/(^|\/)(__MACOSX\/|\.DS_Store$|\._[^/]*$)/.test(p));
    if (!entries.length) throw new Error('That ZIP is empty.');
    const tops = new Set(entries.map(([p]) => p.split('/')[0]));
    if (tops.size === 1 && entries.every(([p]) => p.includes('/'))) {
      const pre = [...tops][0] + '/';
      entries = entries.map(([p, e]) => [p.slice(pre.length), e]);
    }
    index(entries);
    const first = lookup('');
    if (first) { mount(); await show(first.path, '', true); return; }
    const pages = [...FILES.values()].filter(f => kind(f.path) === 'html').map(f => f.path).sort((a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b));
    if (!pages.length) throw new Error('No .html files found in that ZIP.');
    if (pages.length === 1) { mount(); await show(pages[0], '', true); return; }
    const box = $('pick'); box.innerHTML = '<p>No index.html found - pick a page to open:</p>';
    pages.forEach(p => {
      const b = document.createElement('button'); b.textContent = p;
      b.onclick = async () => { mount(); await show(p, '', true); };
      box.appendChild(b);
    });
    setStatus('');
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + (err && err.message ? err.message : err), true);
  }
}

$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) launch(f); });
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); document.body.classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); document.body.classList.remove('drag'); }));
window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && !frame) launch(f); });
})();
</script>
</body>
