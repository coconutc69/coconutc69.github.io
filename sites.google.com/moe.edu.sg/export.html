<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export Recording</title>
<style>
:root{color-scheme:dark}
body{font:15px system-ui,sans-serif;background:#0f1115;color:#e8eaed;max-width:560px;margin:auto;padding:20px}
h1{font-size:20px}.c{background:#1a1d24;border-radius:12px;padding:14px;margin:12px 0}
button{background:#4f8cff;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}.m{color:#8b93a1;font-size:13px;margin-top:6px}
progress{width:100%;margin-top:10px}
</style></head><body>
<h1>⇥ Export Recording</h1>
<div class="c"><b>1. Project folder</b><br><br><button id="dir">Select project folder</button><div class="m" id="di">No folder selected</div></div>
<div class="c"><b>2. Export</b><br><br><button id="go" disabled>Merge into one video…</button>
<progress id="pg" value="0" max="1" hidden></progress><div class="m" id="st">Pick where to save the merged .webm (Google Drive works).</div></div>
<div class="m">Parts are joined without re-encoding, one at a time, so memory use stays low and export is fast.</div>
<script>
const $=id=>document.getElementById(id);let files=[];
if(!window.showDirectoryPicker)document.body.insertAdjacentHTML('afterbegin','<p style="color:#e5484d">Use desktop Chrome / ChromeOS Chrome.</p>');
const TOP=new Set([0x1F43B675,0x1549A966,0x1654AE6B,0x1C53BB6B,0x114D9B74,0x1254C367,0x1941A469,0x1043A770]);
const rid=(b,p)=>{let l=1,m=128;while(l<5&&!(b[p]&m)){l++;m>>=1}let v=0;for(let i=0;i<l;i++)v=v*256+b[p+i];return[v,l]};
const rsz=(b,p)=>{let l=1,m=128;while(l<9&&!(b[p]&m)){l++;m>>=1}let v=b[p]&(m-1),all=v==m-1;for(let i=1;i<l;i++){v=v*256+b[p+i];if(b[p+i]!=255)all=false}return[all?-1:v,l]};
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const be8=n=>{const a=new Uint8Array(8);for(let i=7;i>=0;i--){a[i]=n%256;n=Math.floor(n/256)}return a};
const sz8=n=>{const a=be8(n);a[0]=1;return a};
function parse(b){
 let[,il]=rid(b,0),[sz,sl]=rsz(b,il),p=il+sl+sz;const ebml=b.subarray(0,p);
 [,il]=rid(b,p);[,sl]=rsz(b,p+il);p+=il+sl;
 const o={ebml,info:null,tracks:null,cl:[]};
 while(p<b.length){
  const[id,l]=rid(b,p),[s,sl2]=rsz(b,p+l),ds=p+l+sl2,de=s<0?b.length:Math.min(ds+s,b.length);
  if(id==0x1F43B675){
   const c={tc:0,kids:[],end:0};p=ds;
   while(p<b.length){
    const[i2,l2]=rid(b,p),[s2,sl3]=rsz(b,p+l2);if(TOP.has(i2))break;
    const d2=p+l2+sl3,e2=Math.min(d2+s2,b.length);
    if(i2==0xE7){for(let k=d2;k<e2;k++)c.tc=c.tc*256+b[k]}
    else{c.kids.push(b.subarray(p,e2));
     if(i2==0xA3){const[,tl]=rsz(b,d2);c.end=Math.max(c.end,c.tc+((b[d2+tl]<<8|b[d2+tl+1])<<16>>16))}}
    p=e2}
   o.cl.push(c)
  }else{if(id==0x1549A966)o.info=b.subarray(ds,de);if(id==0x1654AE6B)o.tracks=b.subarray(p,de);p=de}}
 return o}
function kids(b){const r=[];let p=0;while(p<b.length){const[i,l]=rid(b,p),[s,sl]=rsz(b,p+l),e=p+l+sl+s;r.push([i,b.subarray(p,e)]);p=e}return r}
$('dir').onclick=async()=>{try{
 const d=await showDirectoryPicker({id:'rec',mode:'read'});files=[];
 for await(const[n,h]of d.entries())if(/^part-\d+\.webm$/.test(n))files.push(h);
 files.sort((a,b)=>a.name.localeCompare(b.name));let sz=0;for(const f of files)sz+=(await f.getFile()).size;
 $('di').textContent=`${d.name}: ${files.length} parts, ${(sz/1e6).toFixed(0)} MB`;$('go').disabled=!files.length}catch(e){}};
$('go').onclick=async()=>{try{
 const out=await showSaveFilePicker({suggestedName:'recording.webm',types:[{accept:{'video/webm':['.webm']}}]});
 const w=await out.createWritable();$('go').disabled=true;$('dir').disabled=true;$('pg').hidden=false;$('pg').max=files.length;
 let off=0,dOff=0;
 for(let i=0;i<files.length;i++){
  $('st').textContent=`Merging part ${i+1} / ${files.length}…`;$('pg').value=i;
  const o=parse(new Uint8Array(await(await files[i].getFile()).arrayBuffer()));
  if(i==0){
   const body=cat(...kids(o.info).filter(k=>k[0]!=0x4489).map(k=>k[1])),dur=new Uint8Array([0x44,0x89,0x88,0,0,0,0,0,0,0,0]);
   await w.write(cat(o.ebml,new Uint8Array([0x18,0x53,0x80,0x67,1,255,255,255,255,255,255,255]),
    new Uint8Array([0x15,0x49,0xA9,0x66]),sz8(body.length+11),body,dur,o.tracks));
   dOff=o.ebml.length+12+12+body.length+3}
  let end=0;
  for(const c of o.cl){const kb=cat(...c.kids);end=Math.max(end,c.end);
   await w.write(cat(new Uint8Array([0x1F,0x43,0xB6,0x75]),sz8(10+kb.length),new Uint8Array([0xE7,0x88]),be8(c.tc+off),kb))}
  off+=end+17}
 const d=new Uint8Array(8);new DataView(d.buffer).setFloat64(0,off);
 await w.seek(dOff);await w.write(d);await w.close();
 $('pg').value=files.length;$('st').textContent=`Done — ${fmt(off/1000)} video saved.`;$('go').disabled=false;$('dir').disabled=false
}catch(e){console.error(e);$('st').textContent=e.name=='AbortError'?'Cancelled.':'Error: '+e.message;$('go').disabled=false;$('dir').disabled=false}};
const fmt=s=>[s/3600|0,s/60%60|0,s%60|0].map(n=>String(n).padStart(2,'0')).join(':');
</script></body></html>
