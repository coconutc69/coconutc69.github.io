<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chunk Recorder</title>
<style>
:root{color-scheme:dark}
body{font:15px system-ui,sans-serif;background:#0f1115;color:#e8eaed;max-width:560px;margin:auto;padding:20px}
h1{font-size:20px}.c{background:#1a1d24;border-radius:12px;padding:14px;margin:12px 0}
button{background:#4f8cff;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.r{background:#e5484d}
button:disabled{opacity:.4;cursor:default}.m{color:#8b93a1;font-size:13px;margin-top:6px}
.big{font-size:28px;font-variant-numeric:tabular-nums;margin:6px 0}
.w{color:#f5a524}
</style></head><body>
<h1>⏺ Chunk Recorder</h1>
<div class="c"><b>1. Project folder</b><br><br>
<button id="dir">Select project folder</button>
<div class="m" id="di">No folder selected (use an empty folder for a new recording)</div></div>
<div class="c"><b>2. Record</b><br><br>
<button id="go" disabled>Start recording</button>
<div class="big" id="tm">00:00:00</div>
<div class="m" id="st">Pick a folder first.</div>
<div class="m w" id="wn" hidden></div></div>
<div class="m">Saves 0.5-second standalone <code>part-000001.webm</code> files. Merge them with export.html.</div>
<script>
const $=id=>document.getElementById(id);
const CHUNK=500;            // ms per part
const BPS=8_000_000;        // video bitrate
let dir=null,stream=null,cur=null,running=false,idx=0,width=6;
let next=0,timer=null,t0=0,tick=null;
let queue=Promise.resolve(),pending=0,written=0,errors=0,lastErr='';

if(!window.showDirectoryPicker||!navigator.mediaDevices?.getDisplayMedia)
 document.body.insertAdjacentHTML('afterbegin','<p style="color:#e5484d">Use desktop Chrome / ChromeOS Chrome over https (e.g. GitHub Pages).</p>');

const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
const fmt=s=>[s/3600|0,s/60%60|0,s%60|0].map(n=>String(n).padStart(2,'0')).join(':');
const pname=n=>`part-${String(n).padStart(width,'0')}.webm`;

$('dir').onclick=async()=>{try{
 dir=await showDirectoryPicker({id:'rec',mode:'readwrite'});
 let max=0,w=0,count=0;
 for await(const[n]of dir.entries()){const m=/^part-(\d+)\.webm$/.exec(n);if(m){count++;max=Math.max(max,+m[1]);w=Math.max(w,m[1].length)}}
 idx=max;width=w||6;
 $('di').textContent=count?`${dir.name}: ${count} existing parts, continuing after #${max}`:`${dir.name}: empty, ready`;
 $('st').textContent='Ready.';$('go').disabled=false}catch(e){}};

function makeRec(){
 const r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:BPS});
 const parts=[];r.n=++idx;
 r.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
 r.onstop=()=>save(new Blob(parts,{type:'video/webm'}),r.n);
 return r}

function save(blob,n){
 if(blob.size<300)return;                 // nothing useful captured
 pending++;upd();
 queue=queue.then(async()=>{
  try{
   const h=await dir.getFileHandle(pname(n),{create:true});
   const w=await h.createWritable();await w.write(blob);await w.close();written++
  }catch(e){errors++;lastErr=e.message}
  pending--;upd()})}

function upd(){
 $('st').textContent=running?`Recording… ${written} parts saved, ${pending} waiting to write`:`${written} parts saved${pending?`, ${pending} still writing…`:''}`;
 const wn=$('wn');
 if(errors){wn.hidden=false;wn.textContent=`${errors} write error(s): ${lastErr}`}
 else if(pending>60){wn.hidden=false;wn.textContent='Writes are falling behind (slow Drive?) — memory use is growing.'}
 else wn.hidden=true}

// Start the next recorder BEFORE stopping the old one, so no frames fall in a gap.
// Each recorder produces a standalone file (own header + keyframe), which export.html needs.
function rotate(){
 if(!running)return;
 const old=cur;cur=makeRec();cur.start();old.stop();
 next+=CHUNK;timer=setTimeout(rotate,Math.max(0,next-performance.now()))}

async function start(){
 try{
  stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:60,max:60}},audio:false});
 }catch(e){$('st').textContent=e.name=='NotAllowedError'?'Cancelled.':'Error: '+e.message;return}
 written=0;errors=0;pending=0;lastErr='';running=true;
 stream.getVideoTracks()[0].addEventListener('ended',stop);
 cur=makeRec();cur.start();
 t0=performance.now();next=t0+CHUNK;timer=setTimeout(rotate,CHUNK);
 tick=setInterval(()=>{$('tm').textContent=fmt((performance.now()-t0)/1000)},250);
 $('go').textContent='Stop recording';$('go').classList.add('r');$('dir').disabled=true;upd()}

async function stop(){
 if(!running)return;running=false;
 clearTimeout(timer);clearInterval(tick);
 try{cur.stop()}catch(e){}
 stream.getTracks().forEach(t=>t.stop());
 $('go').disabled=true;$('st').textContent='Finishing writes…';
 await queue;await new Promise(r=>setTimeout(r,200));await queue;
 $('go').textContent='Start recording';$('go').classList.remove('r');
 $('go').disabled=false;$('dir').disabled=false;upd()}

$('go').onclick=()=>running?stop():start();
addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue=''}});
</script></body></html>
